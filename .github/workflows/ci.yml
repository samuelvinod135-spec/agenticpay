name: AgenticPay Production CI/CD Pipeline

on:
  push:
    branches: [main, master, staging]
  pull_request:
    branches: [main, master]

jobs:
  typecheck-and-build:
    name: Build & Typecheck (Backend & Frontend)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: |
          npm ci || npm install
          npm --prefix backend ci || npm --prefix backend install
          npm --prefix frontend ci || npm --prefix frontend install

      - name: Build & Compile Backend
        run: npm run build:backend

      - name: Build & Compile Frontend
        run: npm run build:frontend

  test-suite:
    name: Execute Verification Test Matrix
    needs: typecheck-and-build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: |
          npm ci || npm install
          npm --prefix backend ci || npm --prefix backend install

      - name: Launch Local Backend Daemon for Integration Verification
        run: |
          cd backend
          npm run dev &
          sleep 5

      - name: Run Day 8 Security & Rate Limiting Tests
        run: npm run test:day8 --prefix backend

      - name: Run Day 9 Webhook Delivery Tests
        run: npm run test:day9 --prefix backend

      - name: Run Day 10 RPC Resiliency Tests
        run: npm run test:day10 --prefix backend

      - name: Run Day 11 Virtual Card (VCC) Tests
        run: npm run test:day11 --prefix backend

      - name: Run Day 12 Multi-Chain & FX Tests
        run: npm run test:day12 --prefix backend

      - name: Run Day 13 Double-Entry Ledger Tests
        run: npm run test:day13 --prefix backend

      - name: Run Day 14 Anomaly Detection Tests
        run: npm run test:day14 --prefix backend

      - name: Run Day 15 Human Approvals Tests
        run: npm run test:day15 --prefix backend

      - name: Run Day 16 Sub-Agent Hierarchy Tests
        run: npm run test:day16 --prefix backend

      - name: Run Day 18 RBAC & SSO Tests
        run: npm run test:day18 --prefix backend

      - name: Run Master E2E System Verification
        run: npm run test:master --prefix backend
